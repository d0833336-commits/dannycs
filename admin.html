<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Danny CS • Панель Управления</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .admin-box {
            background: linear-gradient(145s, #1e293b, #0f172a);
            border: 2px solid #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 30px;
            display: inline-block;
            width: 90%;
            max-width: 500px;
        }
        h1 { color: #3b82f6; text-shadow: 0 0 10px rgba(59,130,246,0.5); margin-bottom: 5px; }
        .status { font-size: 18px; margin: 15px 0; color: #94a3b8; }
        .msg { background-color: #1e293b; padding: 10px; border-radius: 8px; color: #f59e0b; font-weight: bold; margin: 15px 0; }
        input[type="password"] {
            width: 80%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #1e293b;
            color: white;
            font-size: 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 85%;
            margin: 12px auto;
            padding: 14px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-money { background-color: #10b981; box-shadow: 0 0 10px rgba(16,185,129,0.3); }
        .btn-money:hover { background-color: #059669; }
        .btn-cheat { background-color: #ef4444; box-shadow: 0 0 10px rgba(239,68,68,0.3); }
        .btn-cheat:hover { background-color: #dc2626; }
        .btn-back {
            display: inline-block;
            margin-top: 25px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-back:hover { color: white; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h1>👑 Панель Администратора</h1>
        <p style="color: #64748b; margin-top: 0;">Проект: Danny CS Project</p>

        <p class="status">💰 Текущий баланс на сервере: <span style="color: #10b981; font-weight: bold;">{{ balance }} руб.</span></p>
        <p class="status">🎰 Режим подкрутки ножей:
            {% if cheat == 1 %}
                <span style="color: #ef4444; font-weight: bold;">ВКЛЮЧЕН (100% шанс)</span>
            {% else %}
                <span style="color: #64748b; font-weight: bold;">ВЫКЛЮЧЕН (Обычный рандом)</span>
            {% endif %}
        </p>

        {% if message %}
            <div class="msg">{{ message }}</div>
        {% endif %}

        <form method="POST">
            <input type="password" name="password" placeholder="Введи секретный пароль босса" required>

            <button type="submit" name="action" value="add_money" class="btn btn-money">💰 Начислить +50 000 руб.</button>
            <button type="submit" name="action" value="toggle_cheat" class="btn btn-cheat">⚙️ Переключить подкрутку ножей</button>
        </form>

        <a href="/" class="btn-back">⬅️ Вернуться на главную страницу</a>
    </div>

</body>
</html>
