<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Danny CS Project — Профиль</title>
</head>
<!-- background-color: #0b0f19 — это цвет глубокого ночного космоса -->
<body style="background-color: #0b0f19; font-family: sans-serif; text-align: center; color: #e2e8f0; padding-top: 50px;">

    <!-- Заголовок светится мягким неоновым цветом -->
    <h2 style="color: #a5b4fc; font-size: 32px; text-shadow: 0 0 10px rgba(165,180,252,0.5);">👤 Настройка профиля</h2>

    <!-- Карточка отображения данных (эффект матового полупрозрачного стекла) -->
    <div style="background-color: rgba(23, 28, 41, 0.7); display: inline-block; padding: 25px 45px; border-radius: 12px; border: 1px solid #1e293b; box-shadow: 0 0 20px rgba(165,180,252,0.1); margin-bottom: 25px;">
        <p style="font-size: 20px; margin: 10px 0;">Имя в игре: <strong style="color: #6366f1; text-shadow: 0 0 8px rgba(99,102,241,0.4);">{{ name }}</strong></p>
        <p style="font-size: 20px; margin: 10px 0;">Любимое оружие: <strong style="color: #10b981; text-shadow: 0 0 8px rgba(16,185,129,0.4);">{{ weapon }}</strong></p>
    </div>



    <!-- Форма для изменения ника и пушки (тоже тёмная космическая) -->
    <form method="POST" style="background-color: rgba(23, 28, 41, 0.7); display: inline-block; padding: 20px; border-radius: 12px; border: 1px solid #1e293b; margin-bottom: 30px;">
        <input type="text" name="nickname" placeholder="Новый ник" required style="padding: 10px; margin: 5px; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white;">

        <input type="text" name="weapon" placeholder="Новое оружие" required style="padding: 10px; margin: 5px; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white;">


        <!-- Кнопка сохранения теперь фиолетовая, под стать космосу -->
        <button type="submit" style="padding: 10px 20px; background-color: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; box-shadow: 0 4px 12px rgba(79,70,229,0.3);">
            💾 Сохранить изменения
        </button>
    </form>




    <!-- Красная кнопка назад -->
    <a href="/" style="display: inline-block; padding: 12px 24px; background-color: #ef4444; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; box-shadow: 0 4px 12px rgba(239,68,68,0.2);">
        ⬅️ Вернуться на главную
    </a>

</body>
</html>
